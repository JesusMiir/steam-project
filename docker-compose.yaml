services:
  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm install && npm run start:dev"]
    # environment:
    #   POSTGRES_PASSWORD: password
    #   CLIENT_ID: 1231231231
    #   CLIENT_SECRET: 234234234
    #   DATABASE_URL: postgresql://user:password@database:5432/mydb
    # depends_on:
    #   - database

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    depends_on:
      - backend

